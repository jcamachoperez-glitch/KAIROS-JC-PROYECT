    // -------------------------------------------------------------------------
    // PANTALLA 2 · TU CAMINO (RUTA EN ZIGZAG + LIGA SABAS NIEVES)
    // -------------------------------------------------------------------------
    function renderPathScreen() {
      const course = COURSES[state.selectedCourse];
      const completed = state.completedLessons[course.id] || [];
      const isInvest = course.id === 'invertir';
      const accentHex = isInvest ? '#00D084' : '#FF5A1F';
      const rank = getLeagueRank(state.xp);

      let nextLessonIdx = course.lessons.findIndex(l => !completed.includes(l.id));
      if (nextLessonIdx === -1) nextLessonIdx = course.lessons.length;

      const currentStation = course.lessons[Math.min(nextLessonIdx, course.lessons.length - 1)];
      const kairoLine = nextLessonIdx >= course.lessons.length
        ? `¡Completaste las 10 estaciones de ${course.name}!`
        : `Estación ${Math.min(nextLessonIdx + 1, 10)}: ${currentStation.eagleGuide}`;

      const zigzagOffsets = [0, -40, -58, -28, 18, 52, 58, 24, -20, 0];

      const unitsHTML = course.units.map((unit, uIdx) => {
        let nodesHTML = '';
        for (let idx = unit.range[0]; idx <= unit.range[1]; idx++) {
          const lesson = course.lessons[idx];
          const isDone = completed.includes(lesson.id);
          const isCurrent = !isDone && idx === nextLessonIdx;
          const isUnlocked = state.testerUnlockAll || isDone || isCurrent;
          const offsetX = zigzagOffsets[idx % zigzagOffsets.length];

          let nodeStyle = '';
          let iconContent = '';

          if (isDone) {
            nodeStyle = 'bg-gradient-to-b from-[#FFC933] to-[#FFB800] border-[#B88200] text-[#0B0E14]';
            iconContent = `<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0B0E14" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
          } else if (isCurrent) {
            nodeStyle = isInvest
              ? 'bg-gradient-to-b from-[#10E396] to-[#00D084] border-[#008F5B] text-[#0B0E14]'
              : 'bg-gradient-to-b from-[#FF713D] to-[#FF5A1F] border-[#B83809] text-[#F4F6FA]';
            iconContent = `<span class="text-2xl">${lesson.icon}</span>`;
          } else if (state.testerUnlockAll) {
            nodeStyle = `bg-gradient-to-b from-[#1A2130] to-[#131822] border-[#080A0F] text-[#F4F6FA] hover:border-[${accentHex}]`;
            iconContent = `<span class="text-xl">${lesson.icon}</span>`;
          } else {
            nodeStyle = 'bg-[#131822] border-[#080A0F] text-[#94A3B8]/40 cursor-not-allowed';
            iconContent = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>`;
          }

          nodesHTML += `
            <div class="relative flex flex-col items-center my-3" style="transform: translateX(${offsetX}px);">
              ${isCurrent ? `
                <div class="animate-float mb-1.5 px-2.5 py-0.5 rounded-lg bg-[#FFB800] text-[#0B0E14] text-[9.5px] font-extrabold tracking-wider shadow">
                  SIGUIENTE
                </div>
              ` : ''}

              <div class="relative flex items-center justify-center">
                ${isCurrent ? `<span class="pulse-ring absolute inset-0 rounded-full border-4" style="border-color: ${accentHex};"></span>` : ''}
                <button type="button"
                  ${isUnlocked ? `onclick="openStationPrimer('${course.id}', ${idx})"` : 'disabled'}
                  class="path-node relative w-[68px] h-[68px] rounded-full flex items-center justify-center font-extrabold ${nodeStyle}">
                  ${iconContent}
                  <span class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#0B0E14] border border-white/15 text-[10px] font-mono font-extrabold text-[#F4F6FA] flex items-center justify-center">
                    ${idx + 1}
                  </span>
                </button>
              </div>

              <p class="mt-1.5 font-extrabold text-xs text-center max-w-[180px] leading-tight ${isUnlocked ? 'text-[#F4F6FA]' : 'text-[#94A3B8]/50'}">
                ${lesson.title}
              </p>
            </div>
          `;
        }

        return `
          <div class="mb-5">
            <div class="bg-gradient-to-r from-[#1A2130] to-[#131822] border rounded-2xl p-3.5 mb-3 shadow-md"
              style="border-color: ${accentHex}45;">
              <div class="flex items-center justify-between gap-2">
                <span class="text-[10px] font-mono font-extrabold uppercase tracking-wider" style="color: ${accentHex}">
                  ${course.name} · ${completed.length}/10
                </span>
                ${uIdx === 0 ? `
                  <button type="button" onclick="quickSwitchCourse()"
                    class="text-[10.5px] font-extrabold px-2.5 py-0.5 rounded-lg transition ${isInvest ? 'bg-[#FF5A1F] hover:bg-[#FF713D] text-[#F4F6FA]' : 'bg-[#00D084] hover:bg-[#10E396] text-[#0B0E14]'}">
                    Cambiar a ${isInvest ? 'Tradear' : 'Invertir'}
                  </button>
                ` : ''}
              </div>
              <h2 class="font-extrabold text-sm text-[#F4F6FA] mt-0.5">${unit.title}</h2>
              <p class="text-[11px] text-[#94A3B8]">${highlightGlossary(unit.desc)}</p>
            </div>

            <div class="relative flex flex-col items-center py-1">
              <div class="absolute top-5 bottom-5 w-1 bg-white/[0.08] rounded-full -z-0"></div>
              <div class="relative z-10 flex flex-col items-center w-full">${nodesHTML}</div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="flex-1 flex flex-col h-full overflow-hidden screen-enter">
          <div class="px-3.5 py-2.5 bg-[#0B0E14]/90 border-b border-white/[0.08] shrink-0">
            ${renderKairoEagle('guide', kairoLine, { tag: isInvest ? 'DON AURELIO' : 'SEBASTIÁN VOSS', mentor: course.id })}
          </div>

          <div class="flex-1 overflow-y-auto app-scroll px-4 pt-3.5 pb-20">
            ${unitsHTML}
          </div>

          <div class="px-3.5 py-2.5 bg-[#0B0E14]/95 border-t border-white/[0.09] shrink-0">
            <div class="bg-[#131822] border border-[#FFB800]/35 rounded-2xl px-3.5 py-2 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="text-lg">🏆</span>
                <p class="font-extrabold text-xs text-[#F4F6FA]">Liga Sabas Nieves · Puesto ${rank} de 30</p>
              </div>
              <span class="text-xs font-mono font-extrabold px-2 py-0.5 rounded-lg bg-[#FFB800] text-[#0B0E14]">#${rank}</span>
            </div>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // PANTALLA 3 · MOTION-GRAPHICS BRIEFING STAGE ANTES DE LA LECCIÓN
    // -------------------------------------------------------------------------
    function renderStationPrimerScreen() {
      const { courseId, lessonIndex } = state.activeLesson;
      const lesson = COURSES[courseId].lessons[lessonIndex];
      const accentHex = courseId === 'invertir' ? '#00D084' : '#FF5A1F';
      const mentorPrefix = courseId === 'invertir' ? 'DON AURELIO' : 'SEBASTIÁN VOSS';

      return `
        <div class="flex-1 flex flex-col justify-between px-4 py-3.5 screen-enter overflow-y-auto app-scroll">
          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <button type="button" onclick="returnToPath()"
                class="w-7 h-7 rounded-full bg-[#131822] hover:bg-[#1A2130] border border-white/10 flex items-center justify-center text-[#94A3B8] font-bold">
                ×
              </button>
              <span class="text-[10.5px] font-mono font-extrabold uppercase tracking-wider" style="color: ${accentHex}">
                Estación ${lessonIndex + 1}/10 · Briefing Motion
              </span>
              <span class="w-7"></span>
            </div>

            ${renderKairoEagle('guide', lesson.eagleGuide, { large: true, tag: `${mentorPrefix} · ESTACIÓN ${lessonIndex + 1}`, mentor: courseId })}

            <div class="cinema-frame w-full h-[144px]">
              <canvas id="primer-cinema-canvas" class="w-full h-full block"></canvas>
              <div class="absolute bottom-2 left-2.5 px-2.5 py-1 rounded-lg bg-[#0B0E14]/92 border border-white/10">
                <h2 class="font-extrabold text-sm text-[#F4F6FA]">${lesson.icon} ${lesson.title}</h2>
              </div>
            </div>

            <div class="bg-[#131822] border border-white/[0.09] rounded-2xl p-3.5 space-y-2">
              ${lesson.bullets.map(b => `
                <div class="flex items-center gap-2.5">
                  <span class="w-2 h-2 rounded-full shrink-0" style="background: ${accentHex}"></span>
                  <p class="text-xs font-semibold text-[#F4F6FA] leading-snug">${highlightGlossary(b)}</p>
                </div>
              `).join('')}
            </div>

            <div class="bg-[#131822] border border-[#FFB800]/40 rounded-2xl px-3.5 py-2.5 flex items-center gap-2">
              <span class="text-sm">⚡</span>
              <p class="text-xs font-extrabold text-[#FFB800] leading-snug">${highlightGlossary(lesson.rule)}</p>
            </div>
          </div>

          <div class="pt-3">
            <button type="button" onclick="beginStationChallenges()"
              class="tactile-btn btn-gold w-full py-3.5 rounded-2xl font-extrabold text-sm">
              Comenzar Retos →
            </button>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // PANTALLA 4 · LECCIÓN INTERACTIVA (6 RETOS SIMÉTRICOS + GLOSARIO TAP)
    // -------------------------------------------------------------------------
    function renderLessonScreen() {
      const { courseId, lessonIndex } = state.activeLesson;
      const lesson = COURSES[courseId].lessons[lessonIndex];
      const accentHex = courseId === 'invertir' ? '#00D084' : '#FF5A1F';

      const currentItem = state.questionQueue[state.currentQIndex];
      const remaining = state.questionQueue.length - state.currentQIndex;
      const doneFraction = Math.max(0.08, Math.min(1, (state.totalInitialQuestions - remaining + (state.answerState === 'correct' ? 1 : 0)) / state.totalInitialQuestions));
      const progressPct = Math.round(doneFraction * 100);
      const mentorPrefix = courseId === 'invertir' ? 'DON AURELIO' : 'SEBASTIÁN VOSS';

      let kairoMood = 'guide';
      let kairoTag = `${mentorPrefix} · RETO ${Math.min(state.currentQIndex + 1, state.questionQueue.length)}/${state.questionQueue.length}`;
      let kairoSpeech = '¡Analiza el gráfico! Toca las palabras subrayadas en azul si quieres ver su definición exacta.';
      if (state.answerState === 'correct') {
        kairoMood = 'happy';
        kairoTag = `${mentorPrefix} · ACIERTO`;
        kairoSpeech = courseId === 'invertir'
          ? '¡Criterio patrimonial impecable! Así se protege y multiplica el capital.'
          : '¡Lectura institucional limpia! Así ejecuta un operador con disciplina.';
      } else if (state.answerState === 'wrong') {
        kairoMood = 'alert';
        kairoTag = `${mentorPrefix} · ALERTA`;
        kairoSpeech = '¡Cuidado con esa trampa! Revisa el fundamento abajo y vuelve a intentarlo.';
      }

      const letters = ['A', 'B', 'C'];
      const optionsHTML = currentItem.shuffledOptions.map((optText, i) => {
        const isSelected = state.selectedOption === optText;
        let cardClass = 'text-[#F4F6FA] hover:border-white/25';
        let badgeClass = 'bg-[#0B0E14] border border-white/10 text-[#94A3B8]';

        if (state.answerState === 'idle') {
          if (isSelected) {
            cardClass = 'border-[#FFB800] ring-2 ring-[#FFB800]/45 text-[#F4F6FA]';
            badgeClass = 'bg-[#FFB800] text-[#0B0E14]';
          }
        } else if (state.answerState === 'correct') {
          if (optText === currentItem.correct) {
            cardClass = 'border-[#00D084] ring-2 ring-[#00D084]/45 text-[#F4F6FA]';
            badgeClass = 'bg-[#00D084] text-[#0B0E14]';
          } else {
            cardClass = 'opacity-40 text-[#94A3B8]';
          }
        } else if (state.answerState === 'wrong') {
          if (isSelected) {
            cardClass = 'border-[#FF3B5C] ring-2 ring-[#FF3B5C]/50 text-[#F4F6FA]';
            badgeClass = 'bg-[#FF3B5C] text-[#F4F6FA]';
          } else if (optText === currentItem.correct) {
            cardClass = 'border-[#00D084] text-[#F4F6FA]';
            badgeClass = 'bg-[#00D084] text-[#0B0E14]';
          } else {
            cardClass = 'opacity-40 text-[#94A3B8]';
          }
        }

        return `
          <button type="button"
            ${state.answerState !== 'idle' ? 'disabled' : `onclick="chooseOption(${i})"`}
            class="tactile-card w-full px-3.5 py-3 rounded-2xl text-left flex items-center gap-3 ${cardClass}">
            <span class="w-6 h-6 rounded-lg font-mono font-extrabold text-xs flex items-center justify-center shrink-0 ${badgeClass}">
              ${letters[i]}
            </span>
            <span class="font-semibold text-[13px] leading-snug flex-1">
              ${highlightGlossary(optText)}
            </span>
          </button>
        `;
      }).join('');

      let bottomPanelHTML = '';
      if (state.answerState === 'idle') {
        const hasChoice = state.selectedOption !== null;
        bottomPanelHTML = `
          <div class="p-3.5 bg-[#0B0E14] border-t border-white/[0.09] shrink-0">
            <button type="button"
              ${hasChoice ? 'onclick="checkAnswer()"' : 'disabled'}
              class="tactile-btn w-full py-3.5 rounded-2xl font-extrabold text-sm ${hasChoice ? 'btn-gold' : 'bg-[#131822] border-[#080A0F] text-[#94A3B8]/40 cursor-not-allowed'}">
              Comprobar
            </button>
          </div>
        `;
      } else if (state.answerState === 'correct') {
        bottomPanelHTML = `
          <div class="feedback-enter p-3.5 bg-[#0A241D] border-t-2 border-[#00D084] shrink-0">
            <div class="flex items-center justify-between mb-1">
              <span class="font-extrabold text-sm text-[#00D084]">¡Correcto! +${state.lastQuestionXP} XP</span>
            </div>
            <p class="text-xs font-medium text-[#F4F6FA] mb-3">${highlightGlossary(currentItem.explain)}</p>
            <button type="button" onclick="nextQuestion()"
              class="tactile-btn btn-emerald w-full py-3 rounded-2xl font-extrabold text-sm">
              Continuar
            </button>
          </div>
        `;
      } else {
        bottomPanelHTML = `
          <div class="feedback-enter p-3.5 bg-[#260D14] border-t-2 border-[#FF3B5C] shrink-0">
            <div class="flex items-center justify-between mb-1">
              <span class="font-extrabold text-sm text-[#FF3B5C]">Repasa este criterio</span>
            </div>
            <p class="text-xs font-medium text-[#F4F6FA] mb-3">${highlightGlossary(currentItem.explain)}</p>
            <button type="button" onclick="nextQuestion()"
              class="tactile-btn bg-[#FF3B5C] border-[#B31D38] text-[#F4F6FA] w-full py-3 rounded-2xl font-extrabold text-sm">
              Entendido
            </button>
          </div>
        `;
      }

      const heartsDisplay = [1, 2, 3].map(n => n <= state.hearts ? '❤️' : '🤍').join('');

      return `
        <div class="flex-1 flex flex-col h-full overflow-hidden screen-enter">
          <div class="px-4 pt-2.5 pb-2 flex items-center gap-2.5 shrink-0">
            <button type="button" onclick="requestExitLesson()"
              class="w-7 h-7 rounded-full bg-[#131822] hover:bg-[#1A2130] border border-white/10 flex items-center justify-center text-[#94A3B8] font-bold">
              ×
            </button>
            <div class="flex-1 h-2.5 bg-[#131822] border border-white/[0.08] rounded-full overflow-hidden">
              <div class="h-full rounded-full transition-all duration-300"
                style="width: ${progressPct}%; background: linear-gradient(90deg, #FFB800 0%, ${accentHex} 100%);"></div>
            </div>
            <span class="text-[11px] tracking-tighter shrink-0">${heartsDisplay}</span>
          </div>

          <div class="flex-1 overflow-y-auto app-scroll px-4 py-1 flex flex-col gap-2.5">
            ${renderKairoEagle(kairoMood, kairoSpeech, { tag: kairoTag, mentor: courseId })}

            <div class="cinema-frame w-full h-[124px] shrink-0">
              <canvas id="question-cinema-canvas" class="w-full h-full block"></canvas>
              <button type="button" onclick="openHintModal()"
                class="absolute top-2 right-2 px-2 py-0.5 rounded-lg bg-[#0B0E14]/90 hover:bg-[#1A2130] border border-[#FFB800]/45 text-[10px] font-extrabold text-[#FFB800]">
                ⚡ Regla rápida
              </button>
              <span class="absolute bottom-1.5 left-2 px-2 py-0.5 rounded bg-[#0B0E14]/88 border border-white/10 text-[9.5px] font-bold"
                style="color: ${accentHex}">
                ${lesson.title}
              </span>
            </div>

            <h2 class="font-extrabold text-[15px] leading-snug text-[#F4F6FA]">
              ${highlightGlossary(currentItem.q)}
            </h2>

            <div class="flex flex-col gap-2 pb-1">
              ${optionsHTML}
            </div>
          </div>

          ${bottomPanelHTML}
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // PANTALLA 5 · RESUMEN DE ESTACIÓN
    // -------------------------------------------------------------------------
    function renderSummaryScreen() {
      const { courseId, lessonIndex } = state.activeLesson;
      const course = COURSES[courseId];
      const lesson = course.lessons[lessonIndex];

      const accuracy = Math.round((state.firstTryCorrectCount / state.totalInitialQuestions) * 100);
      const newRank = getLeagueRank(state.xp);
      const mentorPrefix = courseId === 'invertir' ? 'DON AURELIO' : 'SEBASTIÁN VOSS';

      return `
        <div class="flex-1 flex flex-col justify-between p-5 text-center screen-enter overflow-y-auto app-scroll">
          <div class="space-y-3 text-left">
            ${renderKairoEagle('proud', `¡Dominaste ${lesson.title}! Seguimos avanzando con criterio en tu ruta.`, { large: true, tag: mentorPrefix, mentor: courseId })}
          </div>

          <div class="my-3">
            <div class="w-20 h-20 mx-auto rounded-full bg-[#131822] border-2 border-[#FFB800] shadow-[0_0_32px_rgba(255,184,0,0.28)] flex items-center justify-center text-3xl mb-3">
              🏆
            </div>
            <h1 class="font-extrabold text-2xl text-[#F4F6FA]">¡Estación completada!</h1>
            <p class="text-xs text-[#94A3B8] mt-1">${lesson.title} · ${course.name}</p>

            <div class="grid grid-cols-3 gap-2 mt-4">
              <div class="bg-[#131822] border border-[#FFB800]/35 rounded-2xl p-2.5">
                <span class="block text-[9.5px] font-mono font-extrabold text-[#94A3B8]">XP</span>
                <span class="font-extrabold text-base text-[#FFB800]">+${state.lastEarnedXP}</span>
              </div>
              <div class="bg-[#131822] border border-[#00D084]/35 rounded-2xl p-2.5">
                <span class="block text-[9.5px] font-mono font-extrabold text-[#94A3B8]">PRECISIÓN</span>
                <span class="font-extrabold text-base text-[#00D084]">${accuracy}%</span>
              </div>
              <div class="bg-[#131822] border border-[#38BDF8]/35 rounded-2xl p-2.5">
                <span class="block text-[9.5px] font-mono font-extrabold text-[#94A3B8]">LIGA</span>
                <span class="font-extrabold text-base text-[#38BDF8]">#${newRank}/30</span>
              </div>
            </div>
          </div>

          <button type="button" onclick="returnToPath()"
            class="tactile-btn btn-gold w-full py-3.5 rounded-2xl font-extrabold text-sm">
            Continuar en mi ruta
          </button>
        </div>
      `;
    }

    // =========================================================================
    // 8. CONTROLADORES DE INTERACCIÓN
    // =========================================================================
    function handleLogoClick() {
      SoundFX.tap();
      if (state.screen === 'lesson' && state.answerState === 'idle') {
        requestExitLesson();
        return;
      }
      state.screen = 'onboarding';
      render();
    }

    function selectCourse(courseId) {
      SoundFX.tap();
      state.selectedCourse = courseId;
      state.guideCourseTab = courseId;
      saveState();
      render();
    }

    function goToCourseGuide() {
      SoundFX.tap();
      state.previousScreenBeforeGuide = state.screen;
      state.guideCourseTab = state.selectedCourse;
      state.screen = 'course_guide';
      saveState();
      render();
    }

    function toggleCourseGuide() {
      SoundFX.tap();
      if (state.screen === 'course_guide') {
        state.screen = state.previousScreenBeforeGuide || 'path';
        render();
        return;
      }
      if (state.screen === 'lesson') {
        openHintModal();
        return;
      }
      state.previousScreenBeforeGuide = state.screen;
      state.guideCourseTab = state.selectedCourse;
      state.screen = 'course_guide';
      render();
    }

    function switchGuideTab(courseId) {
      SoundFX.tap();
      state.guideCourseTab = courseId;
      state.selectedCourse = courseId;
      saveState();
      render();
    }

    function confirmGuideAndGoToPath() {
      SoundFX.tap();
      state.selectedCourse = state.guideCourseTab || state.selectedCourse;
      state.screen = 'path';
      saveState();
      render();
    }

    function quickSwitchCourse() {
      SoundFX.tap();
      state.selectedCourse = state.selectedCourse === 'invertir' ? 'tradear' : 'invertir';
      state.guideCourseTab = state.selectedCourse;
      saveState();
      render();
      showToast(
        state.selectedCourse === 'invertir' ? 'Ruta: Invertir · Don Aurelio' : 'Ruta: Tradear · Sebastián Voss',
        state.selectedCourse === 'invertir' ? '🏛️' : '📈'
      );
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function openStationPrimer(courseId, lessonIndex) {
      SoundFX.tap();
      state.activeLesson = { courseId, lessonIndex };
      state.screen = 'station_primer';
      render();
    }

    function beginStationChallenges() {
      SoundFX.tap();
      const { courseId, lessonIndex } = state.activeLesson;
      const lesson = COURSES[courseId].lessons[lessonIndex];

      state.questionQueue = lesson.questions.map((qItem, idx) => ({
        ...qItem,
        originalIndex: idx,
        shuffledOptions: shuffleArray(qItem.options)
      }));
      state.totalInitialQuestions = lesson.questions.length;
      state.currentQIndex = 0;
      state.firstTryCorrectCount = 0;
      state.wrongOnceSet = new Set();
      state.selectedOption = null;
      state.answerState = 'idle';
      state.hearts = 3;
      state.combo = 0;
      state.lastEarnedXP = 0;
      state.screen = 'lesson';
      render();
    }

    function chooseOption(optionIdx) {
      if (state.answerState !== 'idle') return;
      SoundFX.tap();
      closeGlossaryPopover();
      const currentItem = state.questionQueue[state.currentQIndex];
      state.selectedOption = currentItem.shuffledOptions[optionIdx];
      render();
    }

    function checkAnswer() {
      if (!state.selectedOption || state.answerState !== 'idle') return;
      closeGlossaryPopover();
      const currentItem = state.questionQueue[state.currentQIndex];
      const isCorrect = state.selectedOption === currentItem.correct;

      if (isCorrect) {
        state.answerState = 'correct';
        state.combo += 1;
        const gained = 10 + (state.combo >= 3 ? 5 : 0);
        state.lastQuestionXP = gained;
        state.xp += gained;
        state.lastEarnedXP += gained;
        if (!state.wrongOnceSet.has(currentItem.originalIndex)) {
          state.firstTryCorrectCount += 1;
        }
        SoundFX.correct(state.combo);
        saveState();
      } else {
        state.answerState = 'wrong';
        state.combo = 0;
        if (state.hearts > 1) state.hearts -= 1;
        state.wrongOnceSet.add(currentItem.originalIndex);
        state.questionQueue.push({
          ...currentItem,
          shuffledOptions: shuffleArray(currentItem.options)
        });
        SoundFX.wrong();
      }
      render();
    }

    function nextQuestion() {
      SoundFX.tap();
      state.currentQIndex += 1;
      state.selectedOption = null;
      state.answerState = 'idle';

      if (state.currentQIndex >= state.questionQueue.length) {
        const { courseId, lessonIndex } = state.activeLesson;
        const lesson = COURSES[courseId].lessons[lessonIndex];

        if (!state.completedLessons[courseId].includes(lesson.id)) {
          state.completedLessons[courseId].push(lesson.id);
          state.xp += 20;
          state.lastEarnedXP += 20;
          if (state.streak < 6) state.streak += 1;
        }
        saveState();
        SoundFX.complete();
        state.screen = 'summary';
        render();
        return;
      }
      render();
    }

    function returnToPath() {
      SoundFX.tap();
      state.activeLesson = null;
      state.screen = 'path';
      render();
    }

    function requestExitLesson() {
      SoundFX.tap();
      const modal = document.getElementById('exit-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeExitModal() {
      SoundFX.tap();
      const modal = document.getElementById('exit-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function confirmExitLesson() {
      closeExitModal();
      returnToPath();
    }

    function openHintModal() {
      SoundFX.tap();
      if (!state.activeLesson) return;
      const { courseId, lessonIndex } = state.activeLesson;
      const lesson = COURSES[courseId].lessons[lessonIndex];
      const body = document.getElementById('hint-modal-body');

      body.innerHTML = `
        ${lesson.bullets.map(b => `
          <div class="bg-[#1A2130] border border-white/[0.08] rounded-xl p-2.5 text-xs text-[#F4F6FA] font-semibold">• ${highlightGlossary(b)}</div>
        `).join('')}
        <div class="bg-[#0B0E14] border border-[#FFB800]/40 rounded-xl p-2.5 text-xs text-[#FFB800] font-extrabold">
          ${highlightGlossary(lesson.rule)}
        </div>
      `;

      const modal = document.getElementById('hint-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeHintModal() {
      SoundFX.tap();
      const modal = document.getElementById('hint-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function toggleTesterUnlock() {
      SoundFX.tap();
      state.testerUnlockAll = !state.testerUnlockAll;
      saveState();
      render();
      showToast(
        state.testerUnlockAll ? 'Modo Tester ON: 20 estaciones desbloqueadas' : 'Modo Tester OFF',
        state.testerUnlockAll ? '🔓' : '🔒'
      );
    }

    function toggleSound() {
      SoundFX.enabled = !SoundFX.enabled;
      if (SoundFX.enabled) {
        SoundFX.tap();
      }
      updateHeaderUI();
    }

    // =========================================================================
    // 9. MENÚ ÚNICO DE AJUSTES (TUERCA) Y SECUENCIA ÉPICA DE ENTRADA SCI-FI
    // =========================================================================
    function toggleSettingsMenu(event) {
      if (event) event.stopPropagation();
      SoundFX.tap();
      closeGlossaryPopover();
      const dd = document.getElementById('settings-dropdown');
      if (!dd) return;
      dd.classList.toggle('hidden');
    }

    function closeSettingsMenu() {
      const dd = document.getElementById('settings-dropdown');
      if (dd && !dd.classList.contains('hidden')) {
        dd.classList.add('hidden');
      }
    }

    let introRAF = null;
    let introTimeout = null;

    function startEpicIntro() {
      const overlay = document.getElementById('kairos-epic-intro');
      const canvas = document.getElementById('epic-intro-canvas');
      if (!overlay || !canvas) return;

      const ctx = canvas.getContext('2d');
      const t0 = performance.now();

      const streaks = Array.from({ length: 44 }, (_, i) => ({
        angle: (i / 44) * Math.PI * 2 + (i % 3) * 0.12,
        dist: 30 + (i * 19) % 240,
        speed: 190 + (i % 7) * 55,
        len: 28 + (i % 5) * 18,
        color: i % 3 === 0 ? '#FFB800' : (i % 3 === 1 ? '#00D084' : '#FF5A1F'),
        width: i % 4 === 0 ? 2.4 : 1.3
      }));

      const holoCandles = Array.from({ length: 14 }, (_, i) => ({
        xRatio: 0.08 + (i / 13) * 0.84,
        phase: i * 0.55,
        bull: i % 3 !== 1,
        h: 34 + (i % 4) * 18
      }));

      function drawIntroFrame(now) {
        if (!document.body.contains(overlay) || overlay.classList.contains('hidden')) {
          introRAF = null;
          return;
        }
        const elapsed = (now - t0) * 0.001;
        const rect = overlay.getBoundingClientRect();
        const w = Math.max(300, rect.width || 450);
        const h = Math.max(500, rect.height || 820);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }

        ctx.save();
        ctx.scale(dpr, dpr);

        ctx.fillStyle = '#07090F';
        ctx.fillRect(0, 0, w, h);

        const cx = w * 0.5;
        const cy = h * 0.43;

        const nebula = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(w, h) * 0.65);
        nebula.addColorStop(0, 'rgba(255, 184, 0, 0.22)');
        nebula.addColorStop(0.38, 'rgba(0, 208, 132, 0.09)');
        nebula.addColorStop(0.7, 'rgba(255, 90, 31, 0.05)');
        nebula.addColorStop(1, 'rgba(7, 9, 15, 0)');
        ctx.fillStyle = nebula;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(56, 189, 248, 0.07)';
        ctx.lineWidth = 1;
        for (let r = 45; r < 380; r += 55) {
          const pulseR = r + ((elapsed * 90) % 55);
          ctx.beginPath();
          ctx.arc(cx, cy, pulseR, 0, Math.PI * 2);
          ctx.stroke();
        }

        if (elapsed > 0.45) {
          const shockT = elapsed - 0.45;
          [0, 0.25].forEach((offset, idx) => {
            const st = shockT - offset;
            if (st > 0 && st < 1.5) {
              const rad = st * 290;
              const alpha = Math.max(0, 0.65 * (1 - st / 1.5));
              ctx.strokeStyle = idx === 0 ? `rgba(255, 184, 0, ${alpha})` : `rgba(0, 208, 132, ${alpha})`;
              ctx.lineWidth = 2.6 - st;
              ctx.beginPath();
              ctx.arc(cx, cy, rad, 0, Math.PI * 2);
              ctx.stroke();
            }
          });
        }

        holoCandles.forEach(c => {
          const x = w * c.xRatio;
          const waveY = cy + Math.sin(elapsed * 3.2 + c.phase) * 95 - (elapsed * 45) % 120 + 60;
          const col = c.bull ? 'rgba(0, 208, 132, 0.28)' : 'rgba(255, 90, 31, 0.26)';
          ctx.strokeStyle = col;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.moveTo(x, waveY - c.h * 0.8);
          ctx.lineTo(x, waveY + c.h * 0.8);
          ctx.stroke();

          ctx.fillStyle = col;
          ctx.fillRect(x - 4, waveY - c.h * 0.4, 8, c.h * 0.8);
        });

        streaks.forEach(s => {
          const travel = (s.dist + elapsed * s.speed) % 340;
          const r1 = 28 + travel;
          const r2 = r1 + s.len;
          const x1 = cx + Math.cos(s.angle) * r1;
          const y1 = cy + Math.sin(s.angle) * r1;
          const x2 = cx + Math.cos(s.angle) * r2;
          const y2 = cy + Math.sin(s.angle) * r2;

          ctx.strokeStyle = s.color;
          ctx.globalAlpha = Math.max(0.1, 1 - travel / 340);
          ctx.lineWidth = s.width;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        });
        ctx.globalAlpha = 1;

        const trailProg = Math.min(1, elapsed / 0.75);
        ctx.strokeStyle = 'rgba(255, 184, 0, 0.45)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 160, cy + 190);
        ctx.quadraticCurveTo(cx - 40, cy + 110, cx - 160 + 160 * trailProg, cy + 190 - 190 * trailProg);
        ctx.stroke();

        ctx.restore();
        introRAF = requestAnimationFrame(drawIntroFrame);
      }

      introRAF = requestAnimationFrame(drawIntroFrame);
      introTimeout = setTimeout(() => finishEpicIntro(false), 2850);
    }

    function finishEpicIntro(manual = false) {
      if (introTimeout) {
        clearTimeout(introTimeout);
        introTimeout = null;
      }
      if (manual) SoundFX.tap();
      const overlay = document.getElementById('kairos-epic-intro');
      if (!overlay || overlay.classList.contains('hidden')) return;
      overlay.classList.add('intro-fade-out');
      setTimeout(() => {
        if (introRAF) {
          cancelAnimationFrame(introRAF);
          introRAF = null;
        }
        overlay.classList.add('hidden');
      }, 440);
    }

    let toastTimer = null;
    function showToast(message, icon = '✅') {
      const banner = document.getElementById('toast-banner');
      document.getElementById('toast-icon').textContent = icon;
      document.getElementById('toast-text').textContent = message;
      banner.classList.remove('opacity-0');
      banner.classList.add('opacity-100');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        banner.classList.remove('opacity-100');
        banner.classList.add('opacity-0');
      }, 2400);
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.glossary-term') && !e.target.closest('#glossary-popover')) {
        closeGlossaryPopover();
      }
      if (!e.target.closest('#settings-dropdown') && !e.target.closest('#btn-settings')) {
        closeSettingsMenu();
      }
    });

    window.addEventListener('resize', () => {
      closeGlossaryPopover();
      closeSettingsMenu();
    });

    window.addEventListener('DOMContentLoaded', () => {
      loadState();
      render();
      startEpicIntro();
    });
  </script>
</body>
