<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kairos JC — El Momento Oportuno | Inversiones y Trading</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            obsidian: '#0B0E14',
            surface: {
              1: '#131822',
              2: '#1A2130',
              bevel: '#090C11'
            },
            gold: {
              DEFAULT: '#FFB800',
              light: '#FFD15C',
              bevel: '#B88200'
            },
            emerald: {
              DEFAULT: '#00D084',
              bevel: '#008F5B'
            },
            coral: {
              DEFAULT: '#FF5A1F',
              bevel: '#B83809'
            },
            cyan: {
              DEFAULT: '#38BDF8',
              popover: '#0F172A'
            },
            crimson: {
              DEFAULT: '#FF3B5C',
              bevel: '#B31D38'
            },
            pearl: '#F4F6FA',
            slate: '#94A3B8'
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --bg-obsidian: #0B0E14;
      --surface-1: #131822;
      --surface-2: #1A2130;
      --surface-bevel: #080A0F;
      --gold-main: #FFB800;
      --gold-bevel: #B88200;
      --emerald-main: #00D084;
      --emerald-bevel: #008F5B;
      --coral-main: #FF5A1F;
      --coral-bevel: #B83809;
      --cyan-main: #38BDF8;
      --crimson-main: #FF3B5C;
      --crimson-bevel: #B31D38;
      --text-pearl: #F4F6FA;
      --text-slate: #94A3B8;
      --spring-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-obsidian);
      color: var(--text-pearl);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-image:
        radial-gradient(circle at 15% 8%, rgba(255, 184, 0, 0.06) 0%, transparent 40%),
        radial-gradient(circle at 86% 18%, rgba(0, 208, 132, 0.05) 0%, transparent 38%),
        radial-gradient(circle at 82% 88%, rgba(255, 90, 31, 0.05) 0%, transparent 42%),
        linear-gradient(180deg, #080A0F 0%, #0B0E14 100%);
    }

    /* Superficies táctiles 3D FinTech con borde sutil 1px y elevación */
    .tactile-card {
      background: linear-gradient(180deg, #1A2130 0%, #131822 100%);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-bottom-width: 4px;
      border-bottom-color: var(--surface-bevel);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 8px 22px rgba(0, 0, 0, 0.5);
      transition: transform 0.18s var(--spring-ease), border-color 0.2s ease, background 0.2s ease;
    }
    .tactile-card:active:not(:disabled) {
      transform: translateY(2px);
      border-bottom-width: 2px;
    }

    /* Botones 3D estilo Duolingo en Oro Soberano (#FFB800), Esmeralda (#00D084) y Coral (#FF5A1F) */
    .tactile-btn {
      border-bottom-width: 4px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.26), 0 10px 24px rgba(0, 0, 0, 0.45);
      transition: transform 0.16s var(--spring-ease), filter 0.18s ease, box-shadow 0.18s ease;
    }
    .tactile-btn:active:not(:disabled) {
      transform: translateY(3px);
      border-bottom-width: 1px;
    }
    .btn-gold {
      background: linear-gradient(180deg, #FFC933 0%, #FFB800 100%);
      border-color: var(--gold-bevel);
      color: #0B0E14;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 10px 26px rgba(255, 184, 0, 0.18);
    }
    .btn-emerald {
      background: linear-gradient(180deg, #10E396 0%, #00D084 100%);
      border-color: var(--emerald-bevel);
      color: #0B0E14;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 10px 24px rgba(0, 208, 132, 0.18);
    }
    .btn-coral {
      background: linear-gradient(180deg, #FF713D 0%, #FF5A1F 100%);
      border-color: var(--coral-bevel);
      color: #F4F6FA;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 10px 24px rgba(255, 90, 31, 0.2);
    }
    .btn-surface {
      background: linear-gradient(180deg, #1A2130 0%, #131822 100%);
      border-color: var(--surface-bevel);
      color: #F4F6FA;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-left: 1px solid rgba(255, 255, 255, 0.09);
      border-right: 1px solid rgba(255, 255, 255, 0.09);
    }

    /* Nodos de la ruta en zigzag */
    .path-node {
      border-bottom-width: 6px;
      box-shadow: inset 0 2px 1px rgba(255, 255, 255, 0.25), 0 10px 24px rgba(0, 0, 0, 0.6);
      transition: transform 0.18s var(--spring-ease), box-shadow 0.22s ease;
    }
    .path-node:active:not(:disabled) {
      transform: translateY(4px);
      border-bottom-width: 2px;
    }

    /* Marco Motion-Graphics para Canvas HD */
    .cinema-frame {
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow:
        0 14px 32px rgba(0, 0, 0, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      background: #131822;
    }

    /* Términos interactivos subrayados del glosario en Electric Cyan (#38BDF8) */
    .glossary-term {
      display: inline;
      color: #7DD3FC;
      background-color: rgba(56, 189, 248, 0.13);
      border-bottom: 2px dashed #38BDF8;
      border-radius: 4px;
      padding: 0 3px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .glossary-term:hover,
    .glossary-term:active {
      background-color: rgba(56, 189, 248, 0.28);
      color: #F4F6FA;
    }

    /* Animaciones sutiles del Águila Kairo y Cuadros de Explicación */
    @keyframes eagleHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    .eagle-hover {
      animation: eagleHover 3s ease-in-out infinite;
    }

    @keyframes eagleBlink {
      0%, 92%, 100% { transform: scaleY(0); }
      95% { transform: scaleY(1); }
    }
    .eagle-eyelid {
      transform-origin: center 27px;
      animation: eagleBlink 3.8s infinite;
    }

    @keyframes subtitleFadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .kairo-subtitle-box {
      animation: subtitleFadeIn 0.28s var(--spring-ease) forwards;
    }

    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.78; }
      75% { transform: scale(1.24); opacity: 0; }
      100% { transform: scale(1.24); opacity: 0; }
    }
    .pulse-ring {
      animation: pulseRing 2.1s cubic-bezier(0.24, 0, 0.38, 1) infinite;
    }

    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .animate-float {
      animation: floatBadge 1.9s ease-in-out infinite;
    }

    @keyframes screenIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .screen-enter {
      animation: screenIn 0.24s var(--spring-ease) forwards;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    .feedback-enter {
      animation: slideUp 0.24s var(--spring-ease) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(4px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .popover-enter {
      animation: popIn 0.16s var(--spring-ease) forwards;
    }

    /* Secuencia Épica de Entrada: Águila Kairos volando al centro con estelas sci-fi */
    @keyframes eagleEpicFlight {
      0% {
        opacity: 0;
        transform: translate3d(-150px, 170px, 0) scale(0.16) rotate(-24deg);
        filter: drop-shadow(0 0 0px rgba(255, 184, 0, 0));
      }
      45% {
        opacity: 1;
        transform: translate3d(24px, -22px, 0) scale(1.16) rotate(6deg);
        filter: drop-shadow(0 0 34px rgba(255, 184, 0, 0.85));
      }
      72% {
        opacity: 1;
        transform: translate3d(-4px, 4px, 0) scale(0.98) rotate(-2deg);
        filter: drop-shadow(0 0 26px rgba(0, 208, 132, 0.65));
      }
      100% {
        opacity: 1;
        transform: translate3d(0px, 0px, 0) scale(1) rotate(0deg);
        filter: drop-shadow(0 0 28px rgba(255, 184, 0, 0.72));
      }
    }
    .eagle-epic-flight {
      animation: eagleEpicFlight 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes wingFlapLeft {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      35% { transform: rotate(-14deg) scaleX(0.92); }
      70% { transform: rotate(7deg) scaleX(1.04); }
    }
    @keyframes wingFlapRight {
      0%, 100% { transform: rotate(0deg) scaleX(1); }
      35% { transform: rotate(14deg) scaleX(0.92); }
      70% { transform: rotate(-7deg) scaleX(1.04); }
    }
    .wing-left-anim {
      transform-origin: 92px 86px;
      animation: wingFlapLeft 0.75s ease-in-out 2;
    }
    .wing-right-anim {
      transform-origin: 128px 86px;
      animation: wingFlapRight 0.75s ease-in-out 2;
    }

    @keyframes introBrandReveal {
      0% { opacity: 0; transform: translateY(16px) scale(0.94); letter-spacing: 0.24em; }
      100% { opacity: 1; transform: translateY(0) scale(1); letter-spacing: 0.02em; }
    }
    .intro-brand-reveal {
      animation: introBrandReveal 0.7s 0.65s var(--spring-ease) both;
    }

    @keyframes introFadeOut {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.04); pointer-events: none; }
    }
    .intro-fade-out {
      animation: introFadeOut 0.45s ease-out forwards;
    }

    .app-scroll::-webkit-scrollbar { width: 4px; }
    .app-scroll::-webkit-scrollbar-track { background: transparent; }
    .app-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start sm:justify-center sm:py-2.5">

  <!-- Contenedor Principal Mobile-First (#0B0E14 + #131822 + #FFB800) -->
  <main id="app-shell"
    class="w-full max-w-[490px] min-h-screen sm:min-h-0 sm:h-[880px] sm:max-h-[96vh] bg-[#0B0E14] sm:rounded-[30px] sm:border sm:border-white/10 sm:shadow-[0_28px_90px_rgba(0,0,0,0.92)] flex flex-col overflow-hidden relative">

    <!-- SECUENCIA CINEMATOGRÁFICA DE ENTRADA (ÁGUILA KAIROS + ESTELAS SCI-FI) -->
    <div id="kairos-epic-intro"
      class="absolute inset-0 z-50 bg-[#07090F] flex flex-col items-center justify-center overflow-hidden select-none">
      <canvas id="epic-intro-canvas" class="absolute inset-0 w-full h-full block"></canvas>

      <button type="button" onclick="finishEpicIntro(true)"
        class="absolute top-4 right-4 z-20 px-3 py-1 rounded-full bg-white/[0.06] hover:bg-white/[0.12] border border-white/15 text-[11px] font-mono font-bold text-[#94A3B8] hover:text-[#F4F6FA] transition">
        Saltar ›
      </button>

      <div class="relative z-10 flex flex-col items-center justify-center px-6 text-center pointer-events-none">
        <!-- Águila de Kairos con alas desplegadas volando al centro -->
        <div class="eagle-epic-flight mb-4">
          <svg width="210" height="175" viewBox="0 0 220 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="introCoreGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#FFB800" stop-opacity="0.45"/>
                <stop offset="55%" stop-color="#00D084" stop-opacity="0.18"/>
                <stop offset="100%" stop-color="#07090F" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="wingGradLeft" x1="12" y1="36" x2="96" y2="104" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFB800"/>
                <stop offset="48%" stop-color="#1E3A5F"/>
                <stop offset="100%" stop-color="#0B0E14"/>
              </linearGradient>
              <linearGradient id="wingGradRight" x1="208" y1="36" x2="124" y2="104" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#00D084"/>
                <stop offset="48%" stop-color="#1E3A5F"/>
                <stop offset="100%" stop-color="#0B0E14"/>
              </linearGradient>
              <linearGradient id="eagleHeadHero" x1="88" y1="34" x2="132" y2="96" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#FFFFFF"/>
                <stop offset="70%" stop-color="#E2E8F0"/>
                <stop offset="100%" stop-color="#94A3B8"/>
              </linearGradient>
            </defs>

            <circle cx="110" cy="88" r="82" fill="url(#introCoreGlow)"/>

            <!-- Ala Izquierda Desplegada -->
            <g class="wing-left-anim">
              <path d="M95 84C72 52 38 32 10 34C22 52 32 62 46 68C28 70 18 75 12 82C30 85 45 86 60 86C42 92 32 98 26 105C48 104 72 98 94 94Z"
                fill="url(#wingGradLeft)" stroke="#FFB800" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M24 44L78 78M32 76L82 86" stroke="#FFD15C" stroke-opacity="0.55" stroke-width="1.2" stroke-linecap="round"/>
            </g>

            <!-- Ala Derecha Desplegada -->
            <g class="wing-right-anim">
              <path d="M125 84C148 52 182 32 210 34C198 52 188 62 174 68C192 70 202 75 208 82C190 85 175 86 160 86C178 92 188 98 194 105C172 104 148 98 126 94Z"
                fill="url(#wingGradRight)" stroke="#00D084" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M196 44L142 78M188 76L138 86" stroke="#00D084" stroke-opacity="0.6" stroke-width="1.2" stroke-linecap="round"/>
            </g>

            <!-- Cola aerodinámica -->
            <path d="M98 124L90 156L110 148L130 156L122 124H98Z" fill="#131822" stroke="#FFB800" stroke-width="1.4" stroke-linejoin="round"/>

            <!-- Pecho blindado Kairos JC con emblema K -->
            <path d="M84 128C86 100 95 88 110 88C125 88 134 100 136 128H84Z" fill="#131822" stroke="#FFB800" stroke-width="1.8"/>
            <g transform="translate(97, 98)">
              <rect x="0" y="0" width="26" height="26" rx="6" fill="#0B0E14" stroke="#FFB800" stroke-width="1.6"/>
              <rect x="5" y="5.5" width="3.8" height="15" rx="1" fill="#FFB800"/>
              <path d="M11 13L20.5 5.5" stroke="#00D084" stroke-width="2.6" stroke-linecap="round"/>
              <path d="M11 13.5L20.5 21" stroke="#FF5A1F" stroke-width="2.6" stroke-linecap="round"/>
            </g>

            <!-- Cabeza Esculpida del Águila Kairos -->
            <path d="M89 62C89 44 98 35 110 35C122 35 131 44 131 62C131 76 123 87 110 90C97 87 89 76 89 62Z" fill="url(#eagleHeadHero)"/>
            <path d="M103 36L110 26L115 34L121 29L119 38" fill="#FFFFFF"/>

            <!-- Ojos Dorados de Alta Precisión -->
            <circle cx="99" cy="55" r="4.5" fill="#0B0E14"/>
            <circle cx="121" cy="55" r="4.5" fill="#0B0E14"/>
            <circle cx="99" cy="54.8" r="2.4" fill="#FFB800"/>
            <circle cx="121" cy="54.8" r="2.4" fill="#FFB800"/>
            <circle cx="97.8" cy="53.6" r="1.1" fill="#FFFFFF"/>
            <circle cx="119.8" cy="53.6" r="1.1" fill="#FFFFFF"/>
            <path d="M92 49.5L103 52.5M117 52.5L128 49.5" stroke="#0B0E14" stroke-width="2.8" stroke-linecap="round"/>

            <!-- Pico Dorado -->
            <path d="M103 61C103 57.5 117 57.5 117 61C117 66.2 113.2 71.5 110 73.5C106.8 71.5 103 66.2 103 61Z"
              fill="#FFB800" stroke="#0B0E14" stroke-width="1.3"/>
          </svg>
        </div>

        <div class="intro-brand-reveal">
          <div class="font-extrabold text-3xl tracking-tight text-[#F4F6FA] flex items-center justify-center">
            <span>Ka</span><span class="text-[#FFB800]">i</span><span>ros</span>
            <span class="ml-1.5 text-[#FFB800]">JC</span>
          </div>
          <p class="text-[11px] font-mono font-extrabold tracking-[0.22em] text-[#00D084] uppercase mt-1">
            EL MOMENTO OPORTUNO
          </p>
        </div>
      </div>
    </div>

    <!-- BARRA SUPERIOR FIJA: LOGO KAIROS JC + RACHAS/XP + TUERCA DE AJUSTES -->
    <header class="w-full px-3.5 py-2.5 bg-[#0B0E14]/95 backdrop-blur-md border-b border-white/[0.09] flex items-center justify-between gap-2 shrink-0 z-30">
      <!-- Esquina Superior Izquierda: Logotipo Oficial Kairos JC -->
      <button type="button" onclick="handleLogoClick()" title="Inicio Kairos JC"
        class="flex items-center gap-2 text-left group focus:outline-none shrink-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-[#1A2130] to-[#131822] border border-[#FFB800]/45 shadow-[0_4px_14px_rgba(255,184,0,0.16)] group-hover:border-[#FFB800] transition flex items-center justify-center shrink-0">
          <svg width="26" height="26" viewBox="0 0 36 36" fill="none">
            <!-- Vela dorada central (#FFB800) -->
            <line x1="10.5" y1="4.5" x2="10.5" y2="31.5" stroke="#FFB800" stroke-width="2.3" stroke-linecap="round"/>
            <rect x="7.8" y="9.5" width="5.4" height="17" rx="1.6" fill="#FFB800"/>
            <!-- Brazo superior K (Electric Emerald #00D084 · Invertir) -->
            <path d="M15 17.5L26.5 7.5" stroke="#00D084" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M21.2 7.2H27V13" stroke="#00D084" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- Brazo inferior K (Coral Orange #FF5A1F · Tradear) -->
            <path d="M15 18.5L26.5 28.5" stroke="#FF5A1F" stroke-width="3.2" stroke-linecap="round"/>
            <path d="M21.2 28.8H27V23" stroke="#FF5A1F" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="leading-none">
          <div class="font-extrabold text-[16px] tracking-tight text-[#F4F6FA] flex items-center">
            <span>Ka</span><span class="text-[#FFB800]">i</span><span>ros</span>
            <span class="ml-1 text-[#FFB800]">JC</span>
          </div>
          <span class="block text-[8px] font-extrabold tracking-[0.13em] text-[#94A3B8] uppercase mt-0.5">
            EL MOMENTO OPORTUNO
          </span>
        </div>
      </button>

      <!-- Controles Superiores Derechos: Racha, XP y Tuerca Única de Ajustes -->
      <div class="flex items-center gap-1.5 relative">
        <div class="flex items-center gap-1 bg-[#131822] border border-white/[0.09] px-2.5 py-1 rounded-xl">
          <span class="text-xs">🔥</span>
          <span id="hdr-streak" class="font-mono font-extrabold text-[11px] text-[#FF5A1F]">5d</span>
        </div>
        <div class="flex items-center gap-1 bg-[#131822] border border-[#FFB800]/30 px-2.5 py-1 rounded-xl">
          <span class="text-xs">⭐</span>
          <span id="hdr-xp" class="font-mono font-extrabold text-[11px] text-[#FFB800]">40 XP</span>
        </div>

        <!-- Botón Único de Ajustes (Tuerca) -->
        <button type="button" id="btn-settings" onclick="toggleSettingsMenu(event)" title="Ajustes"
          class="relative w-9 h-9 rounded-xl bg-[#131822] hover:bg-[#1A2130] border border-white/[0.12] hover:border-[#FFB800]/60 text-[#F4F6FA] flex items-center justify-center transition">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          <span id="settings-tester-badge" class="hidden absolute -top-1 -right-1 w-2.5 h-2.5 rounded-full bg-[#00D084] border-2 border-[#0B0E14]"></span>
        </button>

    const SoundFX = {
      enabled: true,
      ctx: null,

      _getContext() {
        if (!this.enabled) return null;
        try {
          if (!this.ctx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) this.ctx = new AudioCtx();
          }
          if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume();
          }
          return this.ctx;
        } catch (e) {
          return null;
        }
      },

      _tone(freq, duration, type = 'sine', volume = 0.08, delay = 0) {
        const ctx = this._getContext();
        if (!ctx) return;
        try {
          const now = ctx.currentTime + delay;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.exponentialRampToValueAtTime(volume, now + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + duration + 0.02);
        } catch (e) {}
      },

      tap() {
        this._tone(520, 0.045, 'triangle', 0.055, 0);
      },

      correct(combo = 1) {
        const boost = Math.min(combo - 1, 4) * 35;
        this._tone(523.25 + boost, 0.11, 'sine', 0.09, 0);
        this._tone(659.25 + boost, 0.16, 'triangle', 0.09, 0.07);
      },

      wrong() {
        this._tone(210, 0.13, 'sawtooth', 0.06, 0);
        this._tone(168, 0.18, 'sawtooth', 0.06, 0.09);
      },

      complete() {
        this._tone(523.25, 0.12, 'triangle', 0.09, 0);
        this._tone(659.25, 0.12, 'triangle', 0.09, 0.09);
        this._tone(783.99, 0.14, 'triangle', 0.09, 0.18);
        this._tone(1046.5, 0.28, 'sine', 0.10, 0.27);

    const GLOSSARY_KEYS_SORTED = Object.keys(GLOSSARY_DICT).sort((a, b) => b.length - a.length);

      `(^|[^\\p{L}\\p{N}_])(${GLOSSARY_KEYS_SORTED.map(k => k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|')})(?=[^\\p{L}\\p{N}_]|$)`,
      'giu'
    );

    function highlightGlossary(rawText) {
      if (!rawText) return '';
      const str = String(rawText);
      const parts = str.split(/(<[^>]+>)/g);
      return parts.map(part => {
        if (part.startsWith('<')) return part;
        return part.replace(GLOSSARY_REGEX, (fullMatch, prefix, match) => {
          const key = match.toLowerCase();
          if (!GLOSSARY_DICT[key]) return fullMatch;
          const safeKey = key.replace(/'/g, "\\'");
          return `${prefix}<span role="button" tabindex="0" onclick="openGlossaryPopover(event, '${safeKey}')" class="glossary-term">${match}</span>`;
        });
      }).join('');
    }

    function openGlossaryPopover(event, termKey) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      const entry = GLOSSARY_DICT[termKey];
      const popover = document.getElementById('glossary-popover');
      if (!entry || !popover) return;

      SoundFX.tap();
      document.getElementById('gp-title').textContent = entry.title;
      document.getElementById('gp-def').textContent = entry.def;
      document.getElementById('gp-ex').textContent = entry.ex;

      popover.classList.remove('hidden');

      const target = event?.currentTarget;
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const popW = popover.offsetWidth || 300;
      const popH = popover.offsetHeight || 165;
      const margin = 12;

      const wordCenterX = rect.left + rect.width / 2;
      let left = wordCenterX - popW / 2;
      left = Math.max(margin, Math.min(window.innerWidth - popW - margin, left));

      const arrow = document.getElementById('gp-arrow');
      const arrowLeft = Math.max(18, Math.min(popW - 18, wordCenterX - left));

      let top = rect.top - popH - 12;
      if (top >= margin) {
        if (arrow) {
          arrow.style.left = `${arrowLeft}px`;
          arrow.style.top = '';
          arrow.style.bottom = '-8px';
          arrow.className = 'absolute w-3.5 h-3.5 bg-[#0F172A] border-r-2 border-b-2 border-[#38BDF8] rotate-45 -translate-x-1/2';
        }
      } else {
        top = Math.min(window.innerHeight - popH - margin, rect.bottom + 12);
        if (arrow) {
          arrow.style.left = `${arrowLeft}px`;
          arrow.style.bottom = '';
          arrow.style.top = '-8px';
          arrow.className = 'absolute w-3.5 h-3.5 bg-[#0F172A] border-l-2 border-t-2 border-[#38BDF8] rotate-45 -translate-x-1/2';
        }
      }

      popover.style.left = `${Math.round(left)}px`;
      popover.style.top = `${Math.round(top)}px`;
    }

    function closeGlossaryPopover() {
      const popover = document.getElementById('glossary-popover');
      if (popover && !popover.classList.contains('hidden')) {
        popover.classList.add('hidden');
      }
    }

    window.openGlossaryPopover = openGlossaryPopover;
    window.closeGlossaryPopover = closeGlossaryPopover;

    function formatKairoSubtitle(rawText) {
      if (!rawText) return '';
      let formatted = String(rawText);
      const hookMatch = formatted.match(/^([^.!?]+[.!?])(\s+[\s\S]*)$/);
      if (hookMatch) {
        formatted = `<span class="text-[#FFD15C] font-bold">${hookMatch[1]}</span>${hookMatch[2]}`;
      }
      const segments = formatted.split(/(<[^>]+>)/g).map(seg => {
        if (seg.startsWith('<')) return seg;
        return seg.replace(/(\$\d[\d.,]*|\b\d+(?:[.,]\d+)?%|\b\d+:\d+\b)/g,
          '<span class="font-mono text-[#FFB800] font-bold">$1</span>');
      }).join('');
      return highlightGlossary(segments);
    }

    // =========================================================================
    // 4. MOTOR DE GRÁFICOS FINANCIEROS ANIMADOS EN CANVAS HD (18 ESCENAS)
    // =========================================================================
    let activeCanvasRAF = null;

    function stopCanvasAnimation() {
      if (activeCanvasRAF) {
        cancelAnimationFrame(activeCanvasRAF);
        activeCanvasRAF = null;
      }
    }

    function startAnimatedFinancialChart(canvas, config = {}) {
      stopCanvasAnimation();
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      const { sceneType = 'candlesticks_volume', seed = 100, qVariant = 0 } = config;
      const startTime = performance.now();

      function seededRand(i) {
        const x = Math.sin(seed * 12.9898 + i * 78.233 + qVariant * 37.7) * 43758.5453;
        return x - Math.floor(x);
      }

      function drawGrid(w, h) {
        ctx.fillStyle = '#0E131D';
        ctx.fillRect(0, 0, w, h);

        const bgGrad = ctx.createLinearGradient(0, 0, w, h);
        bgGrad.addColorStop(0, 'rgba(26, 33, 48, 0.55)');
        bgGrad.addColorStop(1, 'rgba(11, 14, 20, 0.92)');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, w, h);

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        ctx.lineWidth = 1;
        for (let gx = 32; gx < w; gx += 44) {
          ctx.beginPath();
          ctx.moveTo(gx, 0);
          ctx.lineTo(gx, h);
          ctx.stroke();
        }
        for (let gy = 26; gy < h; gy += 32) {
          ctx.beginPath();
          ctx.moveTo(0, gy);
          ctx.lineTo(w, gy);
          ctx.stroke();
        }
      }

      function traceRoundedRect(x, y, rw, rh, r) {
        const radius = Math.min(r, rw / 2, rh / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + rw, y, x + rw, y + rh, radius);
        ctx.arcTo(x + rw, y + rh, x, y + rh, radius);
        ctx.arcTo(x, y + rh, x, y, radius);
        ctx.arcTo(x, y, x + rw, y, radius);
        ctx.closePath();
      }

      function drawBadge(w, text, color = '#FFB800') {
        ctx.font = '700 9.5px "JetBrains Mono", monospace';
        const padX = 8;
        const tw = ctx.measureText(text).width;
        const bw = tw + padX * 2;
        const bh = 18;
        const bx = w - bw - 8;
        const by = 8;

        ctx.fillStyle = 'rgba(11, 14, 20, 0.88)';
        traceRoundedRect(bx, by, bw, bh, 6);
        ctx.fill();
        ctx.strokeStyle = color;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(text, bx + bw / 2, by + bh / 2 + 0.5);
        ctx.textAlign = 'left';
      }

      function renderFrame(now) {
        if (!document.body.contains(canvas)) {
          activeCanvasRAF = null;
          return;
        }

        const rect = canvas.getBoundingClientRect();
        const w = Math.max(240, rect.width || 400);
        const h = Math.max(100, rect.height || 130);
        const dpr = Math.min(window.devicePixelRatio || 1, 2);

        if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
          canvas.width = Math.round(w * dpr);
          canvas.height = Math.round(h * dpr);
        }

        ctx.save();
        ctx.scale(dpr, dpr);
        const t = (now - startTime) * 0.001;
        drawGrid(w, h);

        const padL = 16;
        const padR = 16;
        const padT = 22;
        const padB = 20;
        const plotW = w - padL - padR;
        const plotH = h - padT - padB;

        if (sceneType === 'candlesticks_volume' || sceneType === 'volume_breakout') {
          const count = 22;
          const step = plotW / count;
          let price = 48 + (qVariant % 3) * 4;
          const candles = [];
          for (let i = 0; i < count; i++) {
            const isBreak = sceneType === 'volume_breakout' && i >= 15;
            const drift = isBreak ? 1.55 : (seededRand(i) - 0.44) * 2.6;
            const open = price;
            const close = open + drift + Math.sin(t * 2 + i) * 0.18;
            const high = Math.max(open, close) + 0.6 + seededRand(i + 40) * 1.4;
            const low = Math.min(open, close) - 0.6 - seededRand(i + 80) * 1.4;
            const vol = isBreak ? 0.78 + seededRand(i + 120) * 0.22 : 0.22 + seededRand(i + 120) * 0.35;
            candles.push({ open, close, high, low, vol });
            price = close;
          }

          const allP = candles.flatMap(c => [c.high, c.low]);
          const minP = Math.min(...allP);
          const maxP = Math.max(...allP);
          const rangeP = Math.max(1, maxP - minP);
          const priceH = plotH * 0.74;
          const volH = plotH * 0.22;

          if (sceneType === 'volume_breakout') {
            const resY = padT + priceH * 0.36;
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = '#FFB800';
            ctx.lineWidth = 1.2;
            ctx.beginPath();
            ctx.moveTo(padL, resY);
            ctx.lineTo(w - padR, resY);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          candles.forEach((c, i) => {
            const cx = padL + i * step + step * 0.5;
            const bull = c.close >= c.open;
            const col = bull ? '#00D084' : '#FF3B5C';

            const yHigh = padT + (1 - (c.high - minP) / rangeP) * priceH;
            const yLow = padT + (1 - (c.low - minP) / rangeP) * priceH;
            const yOpen = padT + (1 - (c.open - minP) / rangeP) * priceH;
            const yClose = padT + (1 - (c.close - minP) / rangeP) * priceH;

            ctx.strokeStyle = col;
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(cx, yHigh);
            ctx.lineTo(cx, yLow);
            ctx.stroke();

            ctx.fillStyle = col;
            const bw = Math.max(4, step * 0.58);
            const topY = Math.min(yOpen, yClose);
            const bodyH = Math.max(2.5, Math.abs(yClose - yOpen));
            ctx.fillRect(cx - bw / 2, topY, bw, bodyH);

            const vh = c.vol * volH;
            ctx.fillStyle = bull ? 'rgba(0, 208, 132, 0.35)' : 'rgba(255, 59, 92, 0.32)';
            ctx.fillRect(cx - bw / 2, h - 8 - vh, bw, vh);
          });

          drawBadge(w, sceneType === 'volume_breakout' ? 'VOLUMEN 3.2x' : 'OHLC LIVE', '#00D084');
        } else if (sceneType === 'risk_reward_1to3' || sceneType === 'position_sizing_sl') {
          const entryY = padT + plotH * 0.66;
          const slY = padT + plotH * 0.88;
          const tpY = padT + plotH * 0.14;

          ctx.fillStyle = 'rgba(0, 208, 132, 0.14)';
          ctx.fillRect(padL + plotW * 0.32, tpY, plotW * 0.64, entryY - tpY);
          ctx.strokeStyle = '#00D084';
          ctx.lineWidth = 1.3;
          ctx.strokeRect(padL + plotW * 0.32, tpY, plotW * 0.64, entryY - tpY);

          ctx.fillStyle = 'rgba(255, 59, 92, 0.18)';
          ctx.fillRect(padL + plotW * 0.32, entryY, plotW * 0.64, slY - entryY);
          ctx.strokeStyle = '#FF3B5C';
          ctx.strokeRect(padL + plotW * 0.32, entryY, plotW * 0.64, slY - entryY);

          ctx.strokeStyle = '#FFB800';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          const pts = 24;
          for (let i = 0; i <= pts; i++) {
            const p = i / pts;
            const px = padL + p * plotW * 0.94;
            const py = i < 8
              ? entryY + Math.sin(i * 1.1) * 7
              : entryY - ((i - 8) / (pts - 8)) * (entryY - tpY - 6) + Math.sin(t * 3 + i) * 3;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          ctx.font = '700 9px "JetBrains Mono", monospace';
          ctx.fillStyle = '#00D084';
          ctx.fillText('TP +3R ($300)', padL + plotW * 0.35, tpY + 13);
          ctx.fillStyle = '#FF3B5C';
          ctx.fillText('STOP LOSS -1R ($100)', padL + plotW * 0.35, slY - 4);
          drawBadge(w, sceneType === 'risk_reward_1to3' ? 'RATIO 1:3' : 'RIESGO 1.0%', '#FFB800');
        } else if (sceneType === 'sr_liquidity_zones') {
          const supY = padT + plotH * 0.80;
          const resY = padT + plotH * 0.24;

          ctx.fillStyle = 'rgba(255, 59, 92, 0.15)';
          ctx.fillRect(padL, resY - 7, plotW, 14);
          ctx.fillStyle = 'rgba(0, 208, 132, 0.15)';
          ctx.fillRect(padL, supY - 7, plotW, 14);

          ctx.strokeStyle = '#38BDF8';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          const steps = 36;
          for (let i = 0; i <= steps; i++) {
            const p = i / steps;
            const px = padL + p * plotW;
            const wave = Math.sin(p * Math.PI * 3.2 + t * 1.2) * (plotH * 0.27);
            const trend = p * plotH * 0.14;
            const py = (supY + resY) / 2 + wave - trend;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          ctx.font = '700 9px "JetBrains Mono", monospace';
          ctx.fillStyle = '#FF3B5C';
          ctx.fillText('RESISTENCIA', padL + 6, resY - 10);
          ctx.fillStyle = '#00D084';
          ctx.fillText('SOPORTE', padL + 6, supY + 16);
          drawBadge(w, 'ZONAS S/R', '#38BDF8');
        } else if (sceneType === 'ma_rsi_subpanel') {
          const splitY = padT + plotH * 0.62;
          ctx.strokeStyle = 'rgba(255,255,255,0.12)';
          ctx.beginPath();
          ctx.moveTo(padL, splitY);
          ctx.lineTo(w - padR, splitY);
          ctx.stroke();

          ctx.strokeStyle = '#00D084';
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          for (let i = 0; i <= 30; i++) {
            const p = i / 30;
            const px = padL + p * plotW;
            const py = splitY - 12 - p * (plotH * 0.42) + Math.sin(i * 0.7 + t * 2) * 5;
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          ctx.strokeStyle = '#FFB800';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          for (let i = 0; i <= 30; i++) {
            const p = i / 30;
            const px = padL + p * plotW;
            const py = splitY - 7 - p * (plotH * 0.36);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);

          ctx.stroke();

          ctx.strokeStyle = '#38BDF8';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          for (let i = 0; i <= 30; i++) {
            const p = i / 30;
            const px = padL + p * plotW;
            const py = splitY + 16 + Math.sin(i * 0.65 + t * 2.2) * 11;
            if (i === 0) ctx.moveTo(px, py);

          drawBadge(w, 'EMA + RSI (64)', '#38BDF8');
        } else if (sceneType === 'orderbook_depth') {
          const midX = w * 0.5;

            const y = padT + 4 + r * rowH;

            const askW = (0.35 + seededRand(r + 10) * 0.55 + Math.cos(t * 2 + r) * 0.05) * (plotW * 0.44);
            ctx.fillStyle = 'rgba(0, 208, 132, 0.28)';
            ctx.fillRect(midX - 6 - bidW, y, bidW, rowH - 3);
            ctx.fillStyle = 'rgba(255, 59, 92, 0.28)';
            ctx.fillRect(midX + 6, y, askW, rowH - 3);

        } else if (sceneType === 'compound_curve' || sceneType === 'productive_capital' || sceneType === 'ter_fee_drag') {

          ctx.strokeStyle = '#00D084';
          ctx.lineWidth = 2.6;

            const p = i / pts;

            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          ctx.strokeStyle = sceneType === 'ter_fee_drag' ? '#FF3B5C' : '#94A3B8';

          ctx.setLineDash([4, 3]);

            const p = i / pts;

            const py = padT + plotH * (1 - p * 0.46);

            else ctx.lineTo(px, py);
          }

          drawBadge(w, badgeTxt, '#00D084');
        } else if (sceneType === 'inflation_erosion') {
          const pts = 28;
          ctx.strokeStyle = '#00D084';
          ctx.lineWidth = 2.4;
          ctx.beginPath();
          for (let i = 0; i <= pts; i++) {
            const p = i / pts;
            const px = padL + p * plotW;

            if (i === 0) ctx.moveTo(px, py);

          ctx.lineWidth = 2.4;
          ctx.beginPath();
          for (let i = 0; i <= pts; i++) {
            const p = i / pts;
            const px = padL + p * plotW;
            const py = padT + plotH * (0.52 + Math.pow(p, 1.3) * 0.40);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          drawBadge(w, 'INFLACIÓN -6%/AÑO', '#FF3B5C');
        } else if (sceneType === 'diversification_matrix' || sceneType === 'asset_classes') {
          const slices = [
            { label: 'ETF GLOBAL 70%', pct: 0.70, col: '#00D084' },
            { label: 'BONOS 20%', pct: 0.20, col: '#38BDF8' },
            { label: 'LIQUIDEZ 10%', pct: 0.10, col: '#FFB800' }
          ];
          let curX = padL;
          const barY = padT + plotH * 0.34;
          const barH = 26;
          slices.forEach((s, idx) => {
            const sw = (plotW - 8) * s.pct;
            ctx.fillStyle = s.col;
            traceRoundedRect(curX, barY, sw, barH, 6);
            ctx.fill();

            ctx.font = '700 9px "JetBrains Mono", monospace';
            ctx.fillStyle = s.col;
            ctx.fillText(s.label, padL + idx * (plotW / 3), barY + barH + 18);
            curX += sw + 4;
          });
          drawBadge(w, sceneType === 'asset_classes' ? 'ETF · BONOS' : 'BAJA CORRELACIÓN', '#FFB800');
        } else {
          const pts = 34;
          ctx.strokeStyle = sceneType === 'fraud_audit' ? '#FF3B5C' : '#00D084';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let i = 0; i <= pts; i++) {
            const p = i / pts;
            const px = padL + p * plotW;
            let py;
            if (sceneType === 'fraud_audit') {
              py = p < 0.72
                ? padT + plotH * (0.85 - p * 0.95)
                : padT + plotH * (0.16 + ((p - 0.72) / 0.28) * 0.78);
            } else {
              const jitter = Math.sin(i * 1.4 + t * 2) * (sceneType === 'horizon_volatility' ? 8 : 4);
              py = padT + plotH * (0.86 - p * 0.72) + jitter;
            }
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
          }
          ctx.stroke();

          const labelMap = {
            liquidity_vs_growth: 'LIQUIDEZ 6 MESES',
            risk_return_frontier: 'FRONTERA EFICIENTE',
            horizon_volatility: 'DCA LARGO PLAZO',
            fraud_audit: 'ALERTA PONZI',
            timeframe_cycles: 'SWING 4H vs 1M',
            equity_journal_curve: 'CHECKLIST +22R'
          };
          drawBadge(w, labelMap[sceneType] || 'KAIROS LIVE', sceneType === 'fraud_audit' ? '#FF3B5C' : '#FFB800');
        }

        ctx.restore();
        activeCanvasRAF = requestAnimationFrame(renderFrame);
      }

      activeCanvasRAF = requestAnimationFrame(renderFrame);

    const STORAGE_KEY = 'kairos_jc_navy_nude_v6';

    let state = {
      screen: 'onboarding',

      selectedOption: null,
      answerState: 'idle',
      lastEarnedXP: 0,
      lastQuestionXP: 10
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          state.selectedCourse = p.selectedCourse || 'invertir';
          state.guideCourseTab = state.selectedCourse;
          state.xp = typeof p.xp === 'number' ? p.xp : 40;
          state.streak = typeof p.streak === 'number' ? p.streak : 5;
          state.testerUnlockAll = !!p.testerUnlockAll;
          if (p.completedLessons) {
            state.completedLessons = {
              invertir: Array.isArray(p.completedLessons.invertir) ? p.completedLessons.invertir : [],
              tradear: Array.isArray(p.completedLessons.tradear) ? p.completedLessons.tradear : []
            };
          }
        }
      } catch (e) {}
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          selectedCourse: state.selectedCourse,
          xp: state.xp,
          streak: state.streak,
          testerUnlockAll: state.testerUnlockAll,
          completedLessons: state.completedLessons
        }));
      } catch (e) {}
    }

    function getLeagueRank(xp) {
      if (xp >= 750) return 1;
      if (xp >= 560) return 2;
      if (xp >= 410) return 3;
      if (xp >= 280) return 4;
      if (xp >= 180) return 5;
      if (xp >= 100) return 6;
      return 7;
    }

    function updateHeaderUI() {
      document.getElementById('hdr-streak').textContent = `${state.streak}d`;
      document.getElementById('hdr-xp').textContent = `${state.xp} XP`;

      const dot = document.getElementById('tester-dot');
      const statusText = document.getElementById('tester-status-text');
      const testerBadge = document.getElementById('settings-tester-badge');

      if (state.testerUnlockAll) {
        dot.className = 'w-2 h-2 rounded-full bg-[#00D084] animate-pulse';
        statusText.textContent = 'ON';
        statusText.className = 'px-2 py-0.5 rounded-md bg-[#00D084]/15 border border-[#00D084]/40 text-[10px] font-mono font-extrabold text-[#00D084]';
        if (testerBadge) testerBadge.classList.remove('hidden');
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-[#94A3B8]';
        statusText.textContent = 'OFF';
        statusText.className = 'px-2 py-0.5 rounded-md bg-white/[0.06] text-[10px] font-mono font-extrabold text-[#94A3B8]';
        if (testerBadge) testerBadge.classList.add('hidden');
      }

      document.getElementById('sound-icon').textContent = SoundFX.enabled ? '🔔' : '🔕';
      document.getElementById('sound-label').textContent = SoundFX.enabled ? 'ON' : 'OFF';
      document.getElementById('sound-label').className = SoundFX.enabled
        ? 'px-2 py-0.5 rounded-md bg-[#38BDF8]/15 border border-[#38BDF8]/40 text-[10px] font-mono font-extrabold text-[#38BDF8]'
        : 'px-2 py-0.5 rounded-md bg-white/[0.06] text-[10px] font-mono font-extrabold text-[#94A3B8]';
    }

    function render() {
      closeGlossaryPopover();
      stopCanvasAnimation();
      updateHeaderUI();
      const container = document.getElementById('screen-container');

      if (state.screen === 'onboarding') {
        container.innerHTML = renderOnboardingScreen();
      } else if (state.screen === 'course_guide') {
        container.innerHTML = renderCourseGuideScreen();
      } else if (state.screen === 'path') {
        container.innerHTML = renderPathScreen();
      } else if (state.screen === 'station_primer') {
        container.innerHTML = renderStationPrimerScreen();
        const { courseId, lessonIndex } = state.activeLesson;
        const lesson = COURSES[courseId].lessons[lessonIndex];
        requestAnimationFrame(() => {
          const canvas = document.getElementById('primer-cinema-canvas');
          if (canvas) {
            startAnimatedFinancialChart(canvas, {
              courseId,
              sceneType: lesson.sceneType,
              seed: (courseId === 'invertir' ? 100 : 500) + lessonIndex * 31,
              qVariant: 0
            });
          }
        });
      } else if (state.screen === 'lesson') {
        container.innerHTML = renderLessonScreen();
        requestAnimationFrame(() => {
          const canvas = document.getElementById('question-cinema-canvas');
          if (canvas && state.activeLesson) {
            const { courseId, lessonIndex } = state.activeLesson;
            const lesson = COURSES[courseId].lessons[lessonIndex];
            const currentItem = state.questionQueue[state.currentQIndex];
            startAnimatedFinancialChart(canvas, {
              courseId,
              sceneType: lesson.sceneType,
              seed: (courseId === 'invertir' ? 100 : 500) + lessonIndex * 31 + currentItem.originalIndex * 11,
              qVariant: currentItem.originalIndex
            });
          }
        });
      } else if (state.screen === 'summary') {
        container.innerHTML = renderSummaryScreen();
      }
    }

              <div class="flex items-center justify-between">
                <span class="text-[10.5px] font-mono font-extrabold uppercase tracking-wider" style="color: ${accentHex}">
                  Briefing Express · 5 seg
                </span>
                <span class="text-[10.5px] font-mono font-bold text-[#94A3B8]">3 Unidades · 10 Estaciones</span>
              </div>

              <div class="space-y-2">
                ${briefing.points.map((pt, i) => `
                  <div class="flex items-center gap-2.5 bg-[#1A2130] border border-white/[0.07] rounded-xl px-3 py-2.5">

                      style="background: ${accentHex}; color: ${isInvest ? '#0B0E14' : '#F4F6FA'};">
                      ${i + 1}

            <div class="bg-[#131822] border border-white/[0.09] rounded-2xl p-3 space-y-1.5">

                  <span class="font-bold text-[#F4F6FA]">${u.title}</span>
                  <span class="text-[10.5px] font-mono font-bold" style="color: ${accentHex}">Est. ${u.range[0] + 1}–${u.range[1] + 1}</span>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="pt-3">
            <button type="button" onclick="confirmGuideAndGoToPath()"
